<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulador Digital de Auditoría</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="min-h-screen pb-12">
  <header class="bg-slate-900 text-white py-4 border-b-4 border-indigo-500 no-print">
    <div class="max-w-5xl mx-auto px-4 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h1 class="text-xl font-bold">Simulador Digital de Auditoría</h1>
        <p class="text-slate-400 text-xs">Evaluación y Auditoría de Sistemas · Universidad de Panamá, CRU Panamá Oeste</p>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <span class="text-slate-300">Rol:</span>
        <select id="rol" class="!w-auto !text-black">
          <option>Auditor</option>
          <option>Administrador</option>
        </select>
      </label>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-5" id="app"></main>

  <!-- Avisos y errores visibles para el usuario -->
  <div id="avisos" class="fixed bottom-4 right-4 left-4 sm:left-auto sm:w-96 space-y-2 no-print"></div>

  <!-- Orden importante: datos -> motor -> almacenamiento -> interfaz -->
  <script src="js/escenarios.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
